[package]
name = "storybook-viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
storybook-kit = { path = ".." }
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
toml = "1"
mutants = "0.0.4"

[dev-dependencies]
tempfile = "3"
